<style>
:root{--pink:#ff3ea5;--lime:#b8ff3c;--blue:#2e5bff;--yellow:#ffe14a;--ink:#17142e;--lilac:#c9b2ff;--bubble:#ffc2e2;--sky:#8fd8ff;
 --dark:#17142e;--shd:#17142e;--bg:#ffffff;--dot:#ffd3ea;--card:#ffffff;--card2:#fffafd;--dash:#d4c8ee;--muted:#d6cdea;--hintbg:rgba(255,255,255,.92);--focus:#fff9d6;
 --stage:linear-gradient(150deg,#fff0f8 0%,#f3f8ff 55%,#f7ffe6 100%);--tgl:linear-gradient(110deg,#ffe3f4,#e8fbff,#f2ffd9,#efe6ff);
 --three:radial-gradient(circle at 18% 22%,rgba(255,62,165,.26),transparent 42%),radial-gradient(circle at 84% 76%,rgba(184,255,60,.32),transparent 44%),radial-gradient(circle at 80% 16%,rgba(46,91,255,.2),transparent 40%),radial-gradient(circle at 20% 86%,rgba(255,225,74,.3),transparent 40%),linear-gradient(180deg,#fff1f9,#f1ecff 50%,#eafaff);--three-top:#fbe9f5;--three-bot:#eef7e7;color-scheme:light}
/* dark mode: UI only. the charm artwork + print/3D texture colors never change */
html[data-theme=dark]{--bg:#272042;--dot:#3f3566;--card:#9488c4;--card2:#a497d0;--dash:#5f5394;--muted:#5f5394;--hintbg:rgba(164,151,208,.94);--focus:#cbbff0;
 --stage:linear-gradient(150deg,#b597c4 0%,#97a3d4 55%,#a2bb93 100%);--tgl:linear-gradient(110deg,#c99bc0,#93b4cf,#a7c08f,#ad9bd6);
 --three:radial-gradient(circle at 18% 22%,rgba(255,62,165,.30),transparent 42%),radial-gradient(circle at 84% 76%,rgba(184,255,60,.20),transparent 44%),radial-gradient(circle at 80% 16%,rgba(46,91,255,.26),transparent 40%),radial-gradient(circle at 20% 86%,rgba(255,225,74,.16),transparent 40%),linear-gradient(180deg,#7a6aa6,#66689e 50%,#587c86);--three-top:#83699f;--three-bot:#647e82;color-scheme:dark}
/* dark mode = same sticker look, just dimmer: black outlines, black text and black hard shadows stay */
html.theming *{transition:background-color .35s,border-color .35s,color .25s!important}
.b3d,.ph,.ex,.toast,.tab.on,.tile.on,.fonts .pbtn.on,.seg button.on,.att.on,.pbtn.on,.marquee{color:var(--dark)}
.hbtns{display:flex;align-items:center;gap:10px;flex:none}
.themebtn{width:56px;height:56px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shd);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s}
.themebtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shd)}
.themebtn svg{position:absolute;width:30px;height:30px;transition:transform .55s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.themebtn .sun{color:var(--ink)}.themebtn .moon{color:var(--ink);transform:translateY(40px) rotate(-90deg) scale(.4);opacity:0}
html[data-theme=dark] .themebtn .sun{transform:translateY(-40px) rotate(180deg) scale(.4);opacity:0}
html[data-theme=dark] .themebtn .moon{transform:none;opacity:1}
.themebtn .sun .rays{transform-origin:12px 12px;animation:spin 8s linear infinite}
.themebtn.boop{animation:boop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boop{40%{transform:scale(1.15) rotate(-12deg)}}
@media (max-width:400px){.logo .star{width:28px;height:28px}.logo{gap:7px}.logo h1{font-size:26px}header{gap:8px;padding:8px 12px 10px}.bagbtn{padding:0 8px 0 12px;gap:6px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* The dotted canvas stays on the large viewport so it paints under Safari's glass.
   The app shell is NOT 100lvh: on iOS 26 that rectangle runs under the status bar and
   under the floating toolbar. --app-top / --app-h track visualViewport (the visible
   rectangle) at rest and whenever the bars or keyboard move. 100dvh is only the
   fallback before that script runs. Body stays position:relative — a fixed body
   makes iOS 26 tint its bars. --sat/--sab are the hardware safe area; the fit
   script turns them into --shell-pad-* so they aren't added twice when the visual
   viewport is already inset. */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{margin:0;overscroll-behavior:none;overflow:hidden}
html{height:100lvh;min-height:100lvh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px}
html.m3d{background-color:var(--three-bot);background-image:var(--three);background-size:100% 100lvh;background-repeat:no-repeat;background-position:0 0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:relative;height:100lvh;font-family:'Fredoka',system-ui,sans-serif;font-size:17px;color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none;margin:0}
#app{position:absolute;left:0;right:0;top:var(--app-top,0px);height:100vh;height:var(--app-h,100dvh);margin:0 auto;max-width:620px;display:flex;flex-direction:column;padding-top:var(--shell-pad-top,var(--sat));padding-left:var(--sal);padding-right:var(--sar);overflow:hidden}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px 10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}.lt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.logo h1{font-family:'Bagel Fat One',cursive;font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--shd);white-space:nowrap}
.logo .star{width:34px;height:34px;flex:none;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph{font-weight:700;font-size:14px;background:var(--lime);border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px;transform:rotate(-3deg);margin-left:4px;box-shadow:2px 2px 0 var(--shd);white-space:nowrap}
.bagbtn{flex:none;display:flex;align-items:center;gap:8px;height:56px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:0 10px 0 14px;font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--shd);cursor:pointer}
.bagbtn svg{width:26px;height:26px}
.bagbtn .n{background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;font-size:16px;transition:transform .25s}
.bagbtn .n.pop{transform:scale(1.35) rotate(-10deg)}
.marquee{display:none;margin:0 0 18px;border:3px solid var(--ink);border-radius:999px;background:#17142e;overflow:hidden;box-shadow:4px 4px 0 var(--pink)}
.marquee .track{display:flex;width:max-content;animation:mq 26s linear infinite;padding:8px 0}
.marquee span{font-family:'Bagel Fat One';font-size:17px;padding:0 18px;white-space:nowrap}
.marquee span:nth-child(4n+1){color:var(--lime)}.marquee span:nth-child(4n+2){color:var(--pink)}.marquee span:nth-child(4n+3){color:var(--yellow)}.marquee span:nth-child(4n){color:var(--sky)}
@keyframes mq{to{transform:translateX(-50%)}}
/* stage */
#stageWrap{flex:1 1 auto;position:relative;min-height:108px;margin:0 12px;border:3px solid var(--ink);border-radius:30px;background:var(--stage);box-shadow:5px 5px 0 var(--shd);overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.topbar>*{pointer-events:auto}
.ibtns{display:flex;gap:12px}
.ibtn{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shd);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s}
.ibtn svg{width:26px;height:26px}
.ibtn:active,.pbtn:active,.tile:active,.stk:active,.att:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shd)}
.ibtn:disabled{opacity:.3}
.pbtn{min-height:56px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shd);padding:0 20px;font:700 17px 'Fredoka';display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.pbtn svg{width:24px;height:24px}
.b3d{background:var(--lime)}
.selbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;z-index:2;pointer-events:none}
.selbar>*{pointer-events:auto}
.hint.fade{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.hint{background:var(--hintbg);border:2.5px solid var(--ink);border-radius:999px;padding:10px 16px;font-weight:600;font-size:16px;text-align:center}
.del{background:var(--pink);color:#fff}
/* sheet */
#sheet{flex:0 1 auto;height:var(--sheet-h,200px);min-height:0;margin:10px 12px 0;background:var(--card);border:3px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0;display:flex;flex-direction:column;transition:height .3s cubic-bezier(.3,1.2,.5,1);overflow:hidden}
#app.collapsed #sheet{flex:none;height:48px}
#sheet{position:relative;z-index:2;will-change:transform}
#tabbar{position:relative;z-index:3;touch-action:none}
#app.collapsed #sheet{touch-action:none}
.grab{flex:none;height:36px;display:grid;place-items:center;cursor:pointer;touch-action:none;border:0;background:none;width:100%}
.grab::before{content:'';width:48px;height:6px;border-radius:9px;background:var(--muted)}
.panels{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:6px 10px 8px}
.panel{display:none}.panel.on{display:block;animation:pin .22s ease}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.sub{font-size:15px;font-weight:600;opacity:.72;margin:10px 2px 6px}
.panel>.sub:first-child{margin-top:2px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{height:68px;min-height:0;border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:2px 2px 0 var(--shd);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;transition:transform .08s,box-shadow .08s}
.tile svg{width:100%;height:100%;display:block}
.tile.on{background:#fff4b8;outline:3px solid var(--pink);outline-offset:2px}
.pnote{font-size:15px;font-weight:600;margin:-6px 2px 14px;padding:8px 12px;border:2.5px dashed var(--dash);border-radius:16px;background:var(--card2);color:var(--ink)}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--shd);cursor:pointer;position:relative;padding:0}
.sw.on{outline:4px solid var(--blue);outline-offset:3px}
.sw.none{background:repeating-conic-gradient(#e9e6f5 0 25%,#fff 0 50%) 0 0/14px 14px}
.sw.none::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--pink);transform:rotate(45deg)}
.sw.custom{background:conic-gradient(#ff3ea5,#ffe14a,#b8ff3c,#5cf2c8,#2e5bff,#c9b2ff,#ff3ea5);overflow:hidden}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;border:3px solid var(--ink);border-radius:22px;padding:10px 16px;margin-top:20px;cursor:pointer;background:var(--tgl);box-shadow:3px 3px 0 var(--shd);font:600 18px 'Fredoka';text-align:left}
.toggle .t1{display:flex;flex-direction:column;gap:2px}.toggle small{font-weight:500;font-size:15px;opacity:.72}
.sw2{width:64px;height:38px;border-radius:999px;border:3px solid var(--ink);background:var(--card);position:relative;flex:none;transition:background .2s}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:left .2s,background .2s}
.on>.sw2{background:var(--pink)}.on>.sw2::after{left:29px;background:var(--card)}
input[type=text]{width:100%;min-height:60px;font:600 18px 'Fredoka';border:3px solid var(--ink);border-radius:20px;padding:10px 16px;outline:none;box-shadow:3px 3px 0 var(--shd);background:var(--card);color:var(--ink)}
input[type=text]:focus{background:var(--focus)}
.trow{display:flex;gap:12px;margin-top:14px}
.trow .pbtn{flex:1}
.pri{background:var(--pink);color:#fff}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fonts .pbtn{flex-direction:column;gap:0;min-height:60px;border-radius:18px;font-size:22px;padding:4px}
.fonts .pbtn small{font:600 15px 'Fredoka';opacity:.7}
.fonts .pbtn.on{background:var(--yellow)}
.rng{display:flex;align-items:center;gap:14px;font-weight:700;font-size:17px;min-height:56px}
.rng span{min-width:42px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--bubble),var(--lilac));outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--shd)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.stk{aspect-ratio:1;min-height:62px;border-radius:16px;border:3px dashed var(--dash);background:var(--card2);display:grid;place-items:center;cursor:pointer;padding:5px;touch-action:pan-y;transition:transform .08s}
.stk img,.stk svg{width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.ghost{position:fixed;width:90px;height:90px;pointer-events:none;z-index:80;transform:translate(-50%,-50%) rotate(-8deg) scale(1.1)}
.ghost img{width:100%;height:100%}
.atts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.att{min-height:84px;border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:3px 3px 0 var(--shd);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px 'Fredoka';transition:transform .08s}
.att svg{width:40px;height:40px}
.att em{font-style:normal;font-size:15px;font-weight:600;opacity:.7}
.att.on{background:#e6ecff;outline:4px solid var(--blue);outline-offset:3px}
.seg{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--shd)}
.seg button{flex:1;min-height:58px;border:0;background:var(--card);font:700 18px 'Fredoka';cursor:pointer;border-left:3px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--yellow)}
.qty{display:flex;align-items:center;gap:18px}
.qty .ibtn{font-size:28px;font-weight:700}
.qty b{font-size:24px;min-width:30px;text-align:center}
.price{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 6px}
.price .big{font-family:'Bagel Fat One';font-size:50px;line-height:1;color:var(--blue);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--shd)}
.ex{font-size:15px;font-weight:700;background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;transform:rotate(3deg)}
.lines{font-size:16px;font-weight:500;margin:10px 2px 18px;display:grid;gap:6px}
.lines div{display:flex;justify-content:space-between}
.addbag{width:100%;min-height:66px;font-family:'Bagel Fat One';font-size:24px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--shd);cursor:pointer;-webkit-text-stroke:1px var(--dark);paint-order:stroke fill;transition:transform .08s,box-shadow .08s}
.addbag:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shd)}
.fine{font-size:15px;opacity:.7;margin-top:14px;text-align:center;font-weight:500}
/* tab bar */
#tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 12px;padding:6px 6px calc(8px + var(--shell-pad-bot,var(--sab)));background:var(--card);border:3px solid var(--ink);border-top:0;border-bottom:0}
.tab{min-height:64px;border:3px solid transparent;border-radius:20px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px 'Fredoka';cursor:pointer;padding:4px 0;transition:background .15s}
.tab svg{width:28px;height:28px}
.tab.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--shd)}
.tab[data-tab=shape].on{background:var(--bubble)}.tab[data-tab=color].on{background:var(--sky)}.tab[data-tab=text].on{background:var(--lilac)}.tab[data-tab=stickers].on{background:var(--lime)}.tab[data-tab=order].on{background:var(--yellow)}
/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translate(-50%,-30px) rotate(-2deg);opacity:0;visibility:hidden;background:var(--yellow);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--shd);padding:14px 20px;font-weight:700;font-size:17px;z-index:90;display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .2s,visibility .2s;width:max-content;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0) rotate(-2deg);opacity:1;visibility:visible}
.toast svg{width:44px;height:44px;flex:none}
.toast small{font-weight:500;font-size:15px;opacity:.75}
.conf{position:fixed;width:14px;height:14px;z-index:85;pointer-events:none;border:2px solid var(--ink)}
/* 3D modal */
.modal{position:absolute;left:0;right:0;top:var(--app-top,0px);height:100vh;height:var(--app-h,100dvh);z-index:60;display:none;background:transparent}
/* full-bleed backdrop: a fixed layer sized well past every iOS edge (status bar, floating toolbar, overscroll) */
@media (max-width:699px){html.m3d #app{visibility:hidden}}
.modal.open{display:flex;align-items:center;justify-content:center}
.mcard{position:relative;z-index:1;width:100%;height:100%;background:transparent;overflow:hidden}
.mhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + var(--shell-pad-top,var(--sat))) calc(14px + var(--sar)) 10px calc(14px + var(--sal));position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none}
.mhead>*{pointer-events:auto}.mhead .logo h1{font-size:32px}
.mfoot .mback{flex:0 0 38%;max-width:none;min-height:68px;font-size:20px;border-radius:24px;box-shadow:5px 5px 0 var(--shd)}
.mfoot .madd{flex:1;width:auto;min-height:68px}
.three-wrap{position:absolute;inset:0;touch-action:none;background:transparent}
.three-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mload{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bagel Fat One';font-size:24px;text-align:center;padding:24px}
.mtag{align-self:center;max-width:100%;text-align:center;background:none;border:0;padding:2px 0;color:var(--ink);font-weight:700;font-size:clamp(13px,3.9vw,16px);letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.4;pointer-events:none;animation:chipFloat 3.6s ease-in-out infinite;will-change:transform}
.mtag:empty{visibility:hidden}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mtag{animation:none}}

.mtag b{color:var(--pink);font-weight:800}
html[data-theme=dark] .mtag{color:#fff}
.mtag .tx{display:block}
.mtag .spc{flex:none;position:relative;width:28px;height:30px;display:block}

<script>(function(){/* Pin the shell to the visual viewport, including at rest.
   100lvh / innerHeight is the large viewport: on iOS 26 its top sits under the
   status bar and its bottom sits under the floating toolbar. visualViewport is
   the rectangle you can actually see, and it moves when those bars collapse or
   the keyboard opens. dvh follows the toolbar but not the keyboard, and it
   ignores offsetTop, so the shell is positioned in px from visualViewport. */
function fit(){
  var vv=window.visualViewport,r=document.documentElement;
  var layoutH=window.innerHeight||0;
  var top=0,h=layoutH;
  if(vv){top=vv.offsetTop||0;h=vv.height||layoutH;}
  var bottomGap=layoutH-top-h;
  var ae=document.activeElement;
  var typing=!!(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable));
  /* iOS 26 can leave offsetTop stuck near 24px after the keyboard closes, with
     the height short by the same amount and no real toolbar gap. Snap that back.
     A showing toolbar is a bottom gap (or a large top inset), so it is kept. */
  if(!typing&&top>0&&top<=40&&Math.abs(bottomGap)<=2){h+=top;top=0;bottomGap=layoutH-h;}
  if(top<0)top=0;
  if(h<1)h=layoutH;
  r.style.setProperty('--app-top',Math.round(top)+'px');
  r.style.setProperty('--app-h',Math.round(h)+'px');
  var cs=getComputedStyle(r);
  var sat=parseFloat(cs.getPropertyValue('--sat'))||0;
  var sab=parseFloat(cs.getPropertyValue('--sab'))||0;
  r.style.setProperty('--shell-pad-top',Math.round(Math.max(0,sat-top))+'px');
  r.style.setProperty('--shell-pad-bot',Math.round(Math.max(0,sab-Math.max(0,bottomGap)))+'px');
  try{document.dispatchEvent(new Event('charm-vv'));}catch(e){}
}
var scheduled=false;
function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;fit();});}
fit();
addEventListener('resize',schedule);
addEventListener('orientationchange',schedule);
addEventListener('pageshow',schedule);
addEventListener('focusin',schedule);
addEventListener('focusout',function(){schedule();setTimeout(schedule,80);setTimeout(schedule,320);});
if(window.visualViewport){visualViewport.addEventListener('resize',schedule);visualViewport.addEventListener('scroll',schedule);}
})();</script>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function starPts(cx,cy,R,r,n=5){const s=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n;const rr=i%2?r:R;s.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return s.join(' ');}

function radial(fn,n=240){const p=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;const r=fn(t);p.push([r*Math.cos(t),r*Math.sin(t)]);}return p;}
function circlesUnion(cs,n=320){return radial(t=>{const dx=Math.cos(t),dy=Math.sin(t);let best=0;for(const [cx,cy,R] of cs){const b=dx*cx+dy*cy;const disc=b*b-(cx*cx+cy*cy-R*R);if(disc>=0){const tt=b+Math.sqrt(disc);if(tt>best)best=tt;}}return best;},n);}

function printMetrics(design,line,dpi=600){
 const g=geo(design.shape,line.size);const bb=g.bb;const inch=parseFloat(line.size);const longU=Math.max(bb.w,bb.h)||1;
 let p=dpi*inch/(2*HALF);if(longU*p<1000)p=1000/longU;
 const W=Math.max(1,Math.ceil(bb.w*p-1e-9)),H=Math.max(1,Math.ceil(bb.h*p-1e-9));
 const mm=1/g.upm,f=v=>+(v*mm).toFixed(3);
 return {g,bb,p,W,H,mmPerUnit:mm,f,dpi:Math.round(p*(2*HALF)/inch),holeMM:+(2*g.holeR*mm).toFixed(2),borderMM:+g.borderMM.toFixed(2),sizeMM:[f(bb.w),f(bb.h)]};
}

function cutlineSvg(met){

 const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fff0f8');bg.addColorStop(.55,'#f3f8ff');bg.addColorStop(1,'#f7ffe6');

 ctx.save();ctx.translate(8,10);ctx.fillStyle='rgba(23,20,46,.14)';ctx.fill(new Path2D(g.outerD));ctx.restore();
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill(new Path2D(g.outerD+' '+g.holeD),'evenodd');

 for(const f of files){
  const name=enc.encode(f.name),data=f.data,crc=crc32(data);
  const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
  const lb=new Uint8Array(local.length+name.length+data.length);lb.set(local,0);lb.set(name,local.length);lb.set(data,local.length+name.length);locals.push(lb);
  const central=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)];
  const cb=new Uint8Array(central.length+name.length);cb.set(central,0);cb.set(name,central.length);centrals.push(cb);offset+=lb.length;
 }
 const centralSize=centrals.reduce((s,c)=>s+c.length,0);
 const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);

 for(const b of locals){out.set(b,p);p+=b.length;}for(const b of centrals){out.set(b,p);p+=b.length;}out.set(eocd,p);return out;
}

function linkPanel(){if(!flow.link)return '';const L=flow.link,phone=flow.customer.phone.trim(),email=flow.customer.email.trim();
 return `<div class="fcard"><b>link ready</b><p class="hintline">demo only — nothing was actually sent. open the composer, or pretend the customer tapped the link on this browser.</p><p class="linkbox">${esc(L.url)}</p><div class="stack">${phone?`<a class="pbtn" href="${esc(smsHref(phone,L.message))}">open in messages</a>`:''}${email?`<a class="pbtn" href="${esc(mailHref(email,L.message))}">open in mail</a>`:''}<button class="pbtn" type="button" data-act="copylink">copy link</button><button class="pbtn go" type="button" data-act="tapped">customer tapped the link →</button></div></div>`;}
function summaryHtml(items){return (items||[]).map(it=>`<div class="r"><span>${esc(lineLabel(it))}</span><b>${money(lineAmount(it.design,it.line).total)}</b></div>`).join('');}
function renderCart(){
 if(!cart.length)return `<p class="hintline">your bag is empty. design a charm, then add it.</p><button class="pbtn go" type="button" data-act="close">back to the studio</button>`;
 return cart.map(it=>`<div class="fcard"><div class="r"><b>${esc(shapeName(it.design.shape))} · ${esc(it.line.size)}"</b><span>${money(lineAmount(it.design,it.line).total)}</span></div><p class="hintline" style="margin:8px 0 0">${esc(ATT[it.line.att]?ATT[it.line.att].name:it.line.att)}${it.design.holo?' · holo stars':''}</p><div class="acts"><button class="ibtn" type="button" data-act="qty" data-id="${esc(it.id)}" data-d="-1" aria-label="one less">–</button><b style="font-size:22px">${esc(it.line.qty)}</b><button class="ibtn" type="button" data-act="qty" data-id="${esc(it.id)}" data-d="1" aria-label="one more">+</button><button class="pbtn" type="button" data-act="remove" data-id="${esc(it.id)}">remove</button></div></div>`).join('')+`<div class="fcard"><div class="r"><span>example total</span><b style="font-family:'Bagel Fat One';font-size:28px">${money(itemsTotal(cart))}</b></div></div><div class="stack"><button class="pbtn go" type="button" data-act="tocheckout">checkout →</button><button class="pbtn" type="button" data-act="orders">orders</button></div>`;
}
function renderOrders(){
 const list=flow.filter==='all'?orders:orders.filter(o=>o.status===flow.filter);
 const filters=[['all','all'],['ordered','ordered'],['exported','exported'],['received_by_3rd_party','at the printer'],['shipped','shipped'],['cancelled','cancelled']];
 let h=`<div class="filters">${filters.map(([id,label])=>`<button type="button" class="${flow.filter===id?'on':''}" data-act="filter" data-id="${id}">${label}</button>`).join('')}</div><div class="stack" style="margin-bottom:12px"><button class="pbtn go" type="button" data-act="csv">download orders CSV</button><button class="pbtn" type="button" data-act="copy">copy CSV for Sheets</button></div>`;
 if(!list.length)h+=`<p class="hintline">${orders.length?'nothing in this filter.':'no orders yet. checkout a charm to make one.'}</p>`;
 h+=list.map(o=>{const adv=NEXT_STATUS[o.status];return `<div class="fcard"><div class="r"><b>${esc(o.order_id)}</b><span class="chip" data-s="${esc(o.status)}">${esc(o.status)}</span></div><p class="hintline" style="margin:8px 0 0">${esc(prettyWhen(o.created_at))} · ${money(o.amount_usd)} · ${esc(o.payment_method)}</p><p class="hintline" style="margin:4px 0 0">${esc(shapeName(o.shape))} · ${esc(o.size_in)}" · ${esc(o.attachment)} · ${o.holo==='yes'?'holo · ':''}×${esc(o.quantity)}</p><p class="hintline" style="margin:4px 0 0">${esc(o.customer_name)} · ${esc([o.ship_city,o.ship_state].filter(Boolean).join(', '))}</p><label class="field" style="margin-top:10px">tracking<input data-track="${esc(o.order_id)}" value="${esc(o.tracking_number||'')}" placeholder="after it ships"></label><label class="field">status<select data-status="${esc(o.order_id)}">${STATUSES.map(s=>`<option value="${s}"${s===o.status?' selected':''}>${s}</option>`).join('')}</select></label><div class="acts"><button class="pbtn" type="button" data-act="zip" data-id="${esc(o.order_id)}">vograce ZIP</button>${adv?`<button class="pbtn" type="button" data-act="advance" data-id="${esc(o.order_id)}">${NEXT_LABEL[o.status]}</button>`:''}</div></div>`;}).join('');
 return h;
}
function renderFlow(){
 const title={cart:'your bag',contact:'checkout',address:'shipping',pay:'how to pay',confirm:'confirm pay',done:'order placed',orders:'orders'}[flow.step]||'charm lab';
 $('#flowTitle').textContent=flow.busy?'one moment…':title;
 const changed=flowStepShown!==flow.step;flowStepShown=flow.step;
 let html='';
 if(flow.busy)html+=`<p class="busy">packing the print files…</p>`;
 html+=errHtml();
 const items=flow.checkoutCart&&flow.checkoutCart.length?flow.checkoutCart:cart;
 if(flow.step==='cart')html+=renderCart();
 else if(flow.step==='contact'){
  html+=stepsHtml(0)+`<p class="hintline">${items.length?esc(items.length===1?lineLabel(items[0]):items.length+' charms'):'bag is empty'} · example total ${money(itemsTotal(items))}. demo checkout, nothing is charged.</p>`+contactFields()+`<p class="hintline">text or email a link to collect the shipping address. the link opens on this browser. you can also type the address yourself.</p><div class="stack"><button class="pbtn" type="button" data-act="send" data-kind="sms">text me a link</button><button class="pbtn" type="button" data-act="send" data-kind="email">email me a link</button><button class="pbtn go" type="button" data-act="typeaddr">I'll type the address</button></div>`+linkPanel();
 }
 else if(flow.step==='address')html+=stepsHtml(1)+`<p class="hintline">where should this charm go?</p>`+addressFields()+`<button class="pbtn go" type="button" data-act="topay">continue to pay</button>`;
 else if(flow.step==='pay'){
  const ship=flow.ship;html+=stepsHtml(2)+`<div class="fcard">${summaryHtml(flow.checkoutCart)}<div class="r" style="margin-top:8px"><span>example total</span><b>${money(itemsTotal(flow.checkoutCart))}</b></div><p class="hintline" style="margin:8px 0 0">${esc(ship.line1)}, ${esc(ship.city)} ${esc(ship.state)} ${esc(ship.zip)}</p></div><p class="hintline">pick a demo payment. no app opens and nothing is charged.</p><div class="pays">${PAYS.map(p=>`<button class="pay" type="button" data-act="method" data-id="${p.id}" style="background:${p.bg};color:${p.fg}">${esc(p.name)}<small>demo</small></button>`).join('')}</div>`;
 }
 else if(flow.step==='confirm'){
  const p=PAYS.find(x=>x.id===flow.method)||{name:flow.method};html+=`<div class="fcard"><p class="busy">pay ${money(itemsTotal(flow.checkoutCart))} with ${esc(p.name)}?</p><p class="hintline">demo only. no charge, no account, no app.</p></div><div class="stack"><button class="pbtn go" type="button" data-act="paid">payment received</button><button class="pbtn" type="button" data-act="backpay">not now</button></div>`;
 }
 else if(flow.step==='done'){
  const rows=flow.placed.map(id=>orders.find(o=>o.order_id===id)).filter(Boolean);
  html+=rows.map(o=>`<div class="fcard"><div class="r"><b style="font-family:'Bagel Fat One';font-size:26px">${esc(o.order_id)}</b><span class="chip" data-s="${esc(o.status)}">${esc(o.status)}</span></div><p class="hintline" style="margin:8px 0 0">${esc(lineLabel({design:o.design,line:o.line}))}</p><p class="hintline">payment received · ${esc(o.payment_method)} · ${money(o.amount_usd)} · nothing was charged</p><button class="pbtn" type="button" data-act="zip" data-id="${esc(o.order_id)}">download vograce ZIP</button></div>`).join('')+`<div class="stack"><button class="pbtn go" type="button" data-act="csv">download orders CSV</button><button class="pbtn" type="button" data-act="copy">copy CSV for Sheets</button><button class="pbtn" type="button" data-act="orders">view orders</button></div>`;
 }
 else if(flow.step==='orders')html+=renderOrders();
 $('#flowBody').innerHTML=html;
 if(changed)$('#flowBody').scrollTop=0;
}
function routeHash(){const h=location.hash.replace(/^#/,'');if(h.startsWith('ship/'))openShip(decodeURIComponent(h.slice(5)));else if(h==='orders')openFlow('orders');else if(h==='checkout')openFlow(cart.length?'contact':'cart');}
window.addEventListener('hashchange',routeHash);
$('#flow').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.cust){flow.customer[t.dataset.cust]=t.value;saveProfile();}if(t.dataset.ship){flow.ship[t.dataset.ship]=t.value;saveProfile();}if(t.dataset.track){const o=orders.find(x=>x.order_id===t.dataset.track);if(o){o.tracking_number=t.value.trim();saveOrders();}}});
$('#flow').addEventListener('change',ev=>{const t=ev.target;if(!t.dataset.status||flow.busy)return;const tr=$(`#flow [data-track="${t.dataset.status}"]`);setStatus(t.dataset.status,t.value,tr?tr.value:'');});
$('#flow').addEventListener('focusin',ev=>{const el=ev.target;if(!(el.matches&&el.matches('input,select,textarea')))return;setTimeout(()=>{const sc=$('#flowBody');if(!sc||!el.isConnected)return;const er=el.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(er.bottom>sr.bottom-8)sc.scrollTop+=er.bottom-(sr.bottom-8);else if(er.top<sr.top+8)sc.scrollTop-=(sr.top+8)-er.top;},280);});
$('#flow').addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b||flow.busy)return;const act=b.dataset.act,id=b.dataset.id;
 if(act==='back'){goBack();return;}
 if(act==='close'){closeFlow();return;}
 if(act==='orders'){flow.err='';openFlow('orders');return;}
 if(act==='remove'){cart=cart.filter(it=>it.id!==id);saveCart();refreshBag();renderFlow();return;}
 if(act==='qty'){const it=cart.find(x=>x.id===id);if(!it)return;it.line.qty=clamp((it.line.qty||1)+(+b.dataset.d||0),1,20);saveCart();refreshBag();renderFlow();return;}
 if(act==='tocheckout'){if(!cart.length){flow.err='your bag is empty';renderFlow();return;}flow.err='';flow.checkoutCart=null;openFlow('contact');return;}
 if(act==='send'){sendLink(b.dataset.kind);return;}
 if(act==='typeaddr'){if(!cart.length){flow.err='your bag is empty';renderFlow();return;}if(!validContact('either')){renderFlow();return;}flow.checkoutCart=clone(cart);flow.err='';openFlow('address');return;}
 if(act==='copylink'){if(flow.link)copyText(flow.link.url);return;}
 if(act==='tapped'){if(flow.link)openShip(flow.link.token);return;}
 if(act==='topay'){if(!validAddress()){renderFlow();return;}ensureCartSnapshot();flow.err='';openFlow('pay');return;}
 if(act==='method'){flow.method=id;flow.err='';openFlow('confirm');return;}
 if(act==='backpay'){openFlow('pay');return;}
 if(act==='paid'){placeOrders();return;}
 if(act==='csv'){downloadOrdersCsv();return;}
 if(act==='copy'){copyOrdersCsv();return;}
 if(act==='zip'){downloadZip(id);return;}
 if(act==='advance'){const o=orders.find(x=>x.order_id===id);if(!o)return;const n=NEXT_STATUS[o.status];if(!n)return;const tr=$(`#flow [data-track="${id}"]`);setStatus(id,n,tr?tr.value:'');return;}
 if(act==='filter'){flow.filter=id;renderFlow();}
});

window.__charm={flipFace:d=>{if(V){const s=camSph();const rel=wrapA(s.az-V.face.az0);flipFace(s.az-rel+(Math.abs(rel)<=Math.PI/2?0:Math.sign(rel)*Math.PI),d,1);}},get yaw(){if(!V||!V.face)return null;return wrapA(camSph().az-V.face.az0)*180/Math.PI;},get tilt(){if(!V||!V.face)return null;return (camSph().pol-V.face.pol0)*180/Math.PI;},zoomTo:s=>{if(V){V.zb=null;V.zRaw=unrubber(s);zApply(s);}},rubber,stretch:f=>zStretch(f),release:()=>zoomHome(),get zoom(){return V?V.zDisp:null},setFrame:(h,w)=>{FRAME_H=h;FRAME_W=w;resetView();},bumpNow:()=>bumpCharm(1,1),applyTheme,exportPrintFiles,buildPrintPack,buildVograceZip,ordersCsv,csvHeader:CSV_COLS.join(','),getOrders:()=>orders,getCart:()=>cart,geo,minScale,get ATT(){return ATT},get S(){return S},order,renderAll,open3D,close3D,commit,undo,redo,addSticker,setTab,setSel:id=>{sel=id;selChanged();},setMotion,collapse,get V(){return V}};
loadCart();loadOrders();loadProfile();refreshBag();
renderAll();
routeHash();
document.fonts&&document.fonts.ready.then(()=>{renderEls();updateSel();});
</script>
