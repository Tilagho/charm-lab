<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>charm lab ✦ design your acrylic charm (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Press+Start+2P&family=Rubik+Bubbles&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
</script>
<style>
:root{--pink:#ff3ea5;--lime:#b8ff3c;--blue:#2e5bff;--yellow:#ffe14a;--ink:#17142e;--lilac:#c9b2ff;--bubble:#ffc2e2;--sky:#8fd8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;font-size:17px;color:var(--ink);background:#fff;background-image:radial-gradient(#ffd3ea 1.3px,transparent 1.4px);background-size:22px 22px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none;margin:0}
#app{position:absolute;inset:0;margin:0 auto;max-width:620px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px 10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}.lt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.logo h1{font-family:'Bagel Fat One',cursive;font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.logo .star{width:34px;height:34px;flex:none;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph{font-weight:700;font-size:14px;background:var(--lime);border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px;transform:rotate(-3deg);margin-left:4px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.bagbtn{flex:none;display:flex;align-items:center;gap:8px;height:56px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 10px 0 14px;font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.bagbtn svg{width:26px;height:26px}
.bagbtn .n{background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;font-size:16px;transition:transform .25s}
.bagbtn .n.pop{transform:scale(1.35) rotate(-10deg)}
.marquee{display:none;margin:0 0 18px;border:3px solid var(--ink);border-radius:999px;background:var(--ink);overflow:hidden;box-shadow:4px 4px 0 var(--pink)}
.marquee .track{display:flex;width:max-content;animation:mq 26s linear infinite;padding:8px 0}
.marquee span{font-family:'Bagel Fat One';font-size:17px;padding:0 18px;white-space:nowrap}
.marquee span:nth-child(4n+1){color:var(--lime)}.marquee span:nth-child(4n+2){color:var(--pink)}.marquee span:nth-child(4n+3){color:var(--yellow)}.marquee span:nth-child(4n){color:var(--sky)}
@keyframes mq{to{transform:translateX(-50%)}}
/* stage */
#stageWrap{flex:1 1 auto;position:relative;min-height:0;margin:0 12px;border:3px solid var(--ink);border-radius:30px;background:linear-gradient(150deg,#fff0f8 0%,#f3f8ff 55%,#f7ffe6 100%);box-shadow:5px 5px 0 var(--ink);overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.topbar>*{pointer-events:auto}
.ibtns{display:flex;gap:12px}
.ibtn{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s}
.ibtn svg{width:26px;height:26px}
.ibtn:active,.pbtn:active,.tile:active,.stk:active,.att:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ibtn:disabled{opacity:.3}
.pbtn{min-height:56px;border-radius:999px;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);padding:0 20px;font:700 17px 'Fredoka';display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.pbtn svg{width:24px;height:24px}
.b3d{background:var(--lime)}
.selbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;z-index:2;pointer-events:none}
.selbar>*{pointer-events:auto}
.hint{background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:999px;padding:10px 16px;font-weight:600;font-size:16px;text-align:center}
.del{background:var(--pink);color:#fff}
/* sheet */
#sheet{flex:none;height:clamp(240px,36dvh,420px);margin-top:14px;background:#fff;border-top:3px solid var(--ink);border-radius:30px 30px 0 0;display:flex;flex-direction:column;transition:height .3s cubic-bezier(.3,1.2,.5,1);overflow:hidden}
#app.collapsed #sheet{height:40px}
.grab{flex:none;height:40px;display:grid;place-items:center;cursor:pointer;touch-action:none;border:0;background:none;width:100%}
.grab::before{content:'';width:56px;height:6px;border-radius:9px;background:#d6cdea}
.panels{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.panel{display:none}.panel.on{display:block;animation:pin .22s ease}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.ptitle{font-family:'Bagel Fat One';font-weight:400;font-size:22px;margin:0 2px 14px}
.sub{font-size:16px;font-weight:600;opacity:.72;margin:20px 2px 12px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{min-height:92px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;transition:transform .08s,box-shadow .08s}
.tile svg{width:46px;height:46px}
.tile span{font-size:15px;font-weight:600}
.tile.on{background:#fff4b8;outline:3px solid var(--pink);outline-offset:3px}
.sws{display:flex;flex-wrap:wrap;gap:14px}
.sw{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;position:relative;padding:0}
.sw.on{outline:4px solid var(--blue);outline-offset:3px}
.sw.none{background:repeating-conic-gradient(#e9e6f5 0 25%,#fff 0 50%) 0 0/14px 14px}
.sw.none::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--pink);transform:rotate(45deg)}
.sw.custom{background:conic-gradient(#ff3ea5,#ffe14a,#b8ff3c,#5cf2c8,#2e5bff,#c9b2ff,#ff3ea5);overflow:hidden}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;border:3px solid var(--ink);border-radius:22px;padding:10px 16px;margin-top:20px;cursor:pointer;background:linear-gradient(110deg,#ffe3f4,#e8fbff,#f2ffd9,#efe6ff);box-shadow:3px 3px 0 var(--ink);font:600 18px 'Fredoka';text-align:left}
.toggle .t1{display:flex;flex-direction:column;gap:2px}.toggle small{font-weight:500;font-size:15px;opacity:.72}
.sw2{width:64px;height:38px;border-radius:999px;border:3px solid var(--ink);background:#fff;position:relative;flex:none;transition:background .2s}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:left .2s,background .2s}
.on>.sw2{background:var(--pink)}.on>.sw2::after{left:29px;background:#fff}
input[type=text]{width:100%;min-height:60px;font:600 18px 'Fredoka';border:3px solid var(--ink);border-radius:20px;padding:10px 16px;outline:none;box-shadow:3px 3px 0 var(--ink);background:#fff;color:var(--ink)}
input[type=text]:focus{background:#fff9d6}
.trow{display:flex;gap:12px;margin-top:14px}
.trow .pbtn{flex:1}
.pri{background:var(--pink);color:#fff}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fonts .pbtn{flex-direction:column;gap:0;min-height:72px;border-radius:22px;font-size:24px;padding:6px}
.fonts .pbtn small{font:600 15px 'Fredoka';opacity:.7}
.fonts .pbtn.on{background:var(--yellow)}
.rng{display:flex;align-items:center;gap:14px;font-weight:700;font-size:17px;min-height:56px}
.rng span{min-width:42px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--bubble),var(--lilac));outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:12px}
.stk{aspect-ratio:1;min-height:74px;border-radius:22px;border:3px dashed #d4c8ee;background:#fffafd;display:grid;place-items:center;cursor:pointer;padding:6px;touch-action:pan-y;transition:transform .08s}
.stk img,.stk svg{width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.ghost{position:fixed;width:90px;height:90px;pointer-events:none;z-index:80;transform:translate(-50%,-50%) rotate(-8deg) scale(1.1)}
.ghost img{width:100%;height:100%}
.atts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.att{min-height:118px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 16px 'Fredoka';transition:transform .08s}
.att svg{width:48px;height:48px}
.att em{font-style:normal;font-size:15px;font-weight:600;opacity:.7}
.att.on{background:#e6ecff;outline:4px solid var(--blue);outline-offset:3px}
.seg{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.seg button{flex:1;min-height:58px;border:0;background:#fff;font:700 18px 'Fredoka';cursor:pointer;border-left:3px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--yellow)}
.qty{display:flex;align-items:center;gap:18px}
.qty .ibtn{font-size:28px;font-weight:700}
.qty b{font-size:24px;min-width:30px;text-align:center}
.price{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 6px}
.price .big{font-family:'Bagel Fat One';font-size:50px;line-height:1;color:var(--blue);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.ex{font-size:15px;font-weight:700;background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;transform:rotate(3deg)}
.lines{font-size:16px;font-weight:500;margin:10px 2px 18px;display:grid;gap:6px}
.lines div{display:flex;justify-content:space-between}
.addbag{width:100%;min-height:66px;font-family:'Bagel Fat One';font-size:24px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;transition:transform .08s,box-shadow .08s}
.addbag:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.fine{font-size:15px;opacity:.7;margin-top:14px;text-align:center;font-weight:500}
/* tab bar */
#tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:3px solid var(--ink)}
.tab{min-height:64px;border:3px solid transparent;border-radius:20px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px 'Fredoka';cursor:pointer;padding:4px 0;transition:background .15s}
.tab svg{width:28px;height:28px}
.tab.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tab[data-tab=shape].on{background:var(--bubble)}.tab[data-tab=color].on{background:var(--sky)}.tab[data-tab=text].on{background:var(--lilac)}.tab[data-tab=stickers].on{background:var(--lime)}.tab[data-tab=order].on{background:var(--yellow)}
/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translate(-50%,-30px) rotate(-2deg);opacity:0;visibility:hidden;background:var(--yellow);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:14px 20px;font-weight:700;font-size:17px;z-index:90;display:flex;align-items:center;gap:12px;transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .2s,visibility .2s;width:max-content;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0) rotate(-2deg);opacity:1;visibility:visible}
.toast svg{width:44px;height:44px;flex:none}
.toast small{font-weight:500;font-size:15px;opacity:.75}
.conf{position:fixed;width:14px;height:14px;z-index:85;pointer-events:none;border:2px solid var(--ink)}
/* 3D modal */
.modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(23,20,46,.45)}
.modal.open{display:flex;align-items:center;justify-content:center}
.mcard{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.mhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));border-bottom:3px solid var(--ink)}
.mhead{border-bottom:3px solid var(--ink)}.mhead .logo h1{font-size:32px}
.mfoot .mback{flex:0 0 38%;max-width:none;min-height:68px;font-size:20px;border-radius:24px;box-shadow:5px 5px 0 var(--ink)}
.mfoot .madd{flex:1;width:auto;min-height:68px}
.three-wrap{flex:1;position:relative;min-height:0;touch-action:none;background:radial-gradient(circle at 18% 22%,rgba(255,62,165,.26),transparent 42%),radial-gradient(circle at 84% 76%,rgba(184,255,60,.32),transparent 44%),radial-gradient(circle at 80% 16%,rgba(46,91,255,.2),transparent 40%),radial-gradient(circle at 20% 86%,rgba(255,225,74,.3),transparent 40%),linear-gradient(180deg,#fff1f9,#f1ecff 50%,#eafaff)}
.three-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mload{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bagel Fat One';font-size:24px;text-align:center;padding:24px}
.mtag{position:absolute;top:14px;left:14px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px;font-weight:600;font-size:16px;line-height:1.35;pointer-events:none}
.mtag b{color:var(--lime)}
.mfoot{flex:none;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);background:#fff}
.mfoot{flex-wrap:nowrap}
.pbtn.on{background:var(--lime)}
@media (min-width:700px){.modal{padding:24px}.mcard{max-width:1000px;max-height:820px;border:3px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink)}.mhead{padding:12px 16px}.mfoot{padding:12px 16px}}
/* desktop adaptation */
@media (min-width:960px){
 .lt{flex-direction:row;align-items:center;gap:12px}
 #app{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:24px;padding:16px 24px 24px}
 header{grid-column:1/-1;padding:4px 0 14px}
 .marquee{display:block;grid-column:1/-1}
 .logo h1{font-size:40px}
 #stageWrap{grid-column:1;grid-row:3/5;margin:0}
 #sheet{grid-column:2;grid-row:3;height:auto!important;margin:0;border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0}
 #sheet .grab{display:none}
 .panels{padding-top:18px}
 #tabbar{grid-column:2;grid-row:4;border:3px solid var(--ink);border-radius:0 0 28px 28px;box-shadow:5px 5px 0 var(--ink)}
}
@media (max-width:360px){.tab{font-size:14px}.logo h1{font-size:26px}}
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div id="app">
 <header>
  <div class="logo">
   <svg class="star" viewBox="0 0 100 100"><path d="M50 4 C55 36 64 45 96 50 C64 55 55 64 50 96 C45 64 36 55 4 50 C36 45 45 36 50 4Z" fill="#b8ff3c" stroke="#17142e" stroke-width="5" stroke-linejoin="round"/></svg>
   <div class="lt"><h1>charm lab</h1><span class="ph">placeholder name</span></div>
  </div>
  <button class="bagbtn" id="bagBtn" aria-label="bag (mockup)"><svg viewBox="0 0 24 24" fill="none" stroke="#17142e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z" fill="#ffc2e2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="n" id="bagN">0</span></button>
 </header>
 <div class="marquee"><div class="track" id="mq"></div></div>
 <section id="stageWrap">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="topbar">
   <div class="ibtns">
    <button class="ibtn" id="undoB" aria-label="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ibtn" id="redoB" aria-label="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ibtn" id="clearB" aria-label="clear stickers and text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
   </div>
   <button class="pbtn b3d" id="open3d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="#fff"/><path d="M12 12 21 7M12 12 3 7M12 12v10"/></svg>3D</button>
  </div>
  <div class="selbar" id="selbar"></div>
 </section>
 <section id="sheet">
  <button class="grab" id="grab" aria-label="show or hide tools"></button>
  <div class="panels" id="panels">
   <div class="panel on" data-panel="shape">
    <div class="ptitle">pick a shape</div>
    <div class="shapes" id="shapes"></div>
   </div>
   <div class="panel" data-panel="color">
    <div class="ptitle">colors</div>
    <div class="sub">print color</div>
    <div class="sws" id="fills"></div>
    <div class="sub">outline</div>
    <div class="sws" id="outlines"></div>
    <button class="toggle" id="holoT"><span class="t1">holo glitter ✦<small>rainbow shimmer + sparkle flakes</small></span><span class="sw2"></span></button>
   </div>
   <div class="panel" data-panel="text">
    <div class="ptitle" id="txtMode">add text</div>
    <input type="text" id="txtIn" maxlength="24" placeholder="type something cute…" value="shaka" enterkeyhint="done" autocomplete="off">
    <div class="trow"><button class="pbtn pri" id="addTxt">+ add text</button><button class="pbtn" id="deselTxt" style="display:none">done ✓</button></div>
    <div class="sub">font</div>
    <div class="fonts" id="fonts"></div>
    <div class="sub">color</div>
    <div class="sws" id="tcolors"></div>
    <div class="sub">size</div>
    <div class="rng"><input type="range" id="tsize" min="16" max="80" value="38" aria-label="text size"><span id="tsizeV">38</span></div>
    <button class="toggle" id="toutT" style="background:#fff"><span class="t1">sticker outline<small>chunky white + ink border</small></span><span class="sw2"></span></button>
   </div>
   <div class="panel" data-panel="stickers">
    <div class="ptitle">tap to slap one on</div>
    <div class="stickers" id="stickers"></div>
   </div>

 const g=geo(S.shape);const outer=new Path2D(g.outerD),pr=new Path2D(g.printD);

 if(S.holo){ctx.save();ctx.clip(pr);const gr=ctx.createLinearGradient(-140,CY-140,140,CY+140);HOLO_STOPS.forEach(([o,c])=>gr.addColorStop(o,c));ctx.globalAlpha=.55;ctx.fillStyle=gr;ctx.fillRect(-170,CY-180,340,360);ctx.globalAlpha=1;const r=seeded(7);const cs=['#fff','#fff6b0','#c8f6ff','#ffd6f0'];for(let i=0;i<600;i++){ctx.fillStyle=cs[i%4];ctx.beginPath();ctx.arc(-160+r()*320,CY-170+r()*340,.5+r()*1.4,0,Math.PI*2);ctx.fill();}ctx.restore();}

  if(e.type==='sticker'){const im=stickerImgs[e.sid];if(im)ctx.drawImage(im,-58,-58,116,116);}

// fake clear acrylic: no diffuse, reflections added on top (premultiplied), slight cool tint + fresnel edge glow
function acrylicMaterial(T,holo){
 const m=new T.MeshPhysicalMaterial({color:0x000000,metalness:0,roughness:.06,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.8,specularIntensity:1,transparent:true,depthWrite:false,premultipliedAlpha:true,iridescence:holo?.6:0,iridescenceIOR:1.3});

  sh.fragmentShader=sh.fragmentShader
   .replace('#include <opaque_fragment>',`float fres=pow(1.0-saturate(abs(dot(normalize(normal),normalize(vViewPosition)))),2.6);
     float a=clamp(0.05+fres*0.6,0.0,0.8);
     vec3 spec=outgoingLight*(0.18+0.82*fres);
     gl_FragColor=vec4(spec+vec3(0.93,0.97,1.0)*a+vec3(0.85,0.93,1.0)*fres*0.3,a);`)
   .replace('#include <premultiplied_alpha_fragment>','');
 };
 m.customProgramCacheKey=()=>'acrylic-v3';
 return m;
}

 const root=new T.Group();scene.add(root);
 const v={renderer,scene,camera,controls,root,envRT,canvas,pivot:null,hang:null,raf:0,interacting:false,t0:performance.now(),tSway:0,last:0,disposables:[]};
 v.ro=new ResizeObserver(()=>{resize3D();kick();});v.ro.observe($('#threeWrap'));
 controls.addEventListener('start',()=>{v.interacting=true;clearTimeout(idleT);motion=false;controls.autoRotate=false;kick();});
 controls.addEventListener('end',()=>{v.interacting=false;kick();clearTimeout(idleT);if(!REDUCED)idleT=setTimeout(()=>{if(!V||V.interacting)return;motion=true;V.controls.autoRotate=true;kick();},2500);});
 controls.addEventListener('change',()=>{if(v.inTick)v.changed=true;else kick();});
 return v;
}
function resize3D(){if(!V)return;const r=$('#threeWrap').getBoundingClientRect();if(!r.width||!r.height)return;V.renderer.setSize(r.width,r.height,false);V.camera.aspect=r.width/r.height;V.camera.updateProjectionMatrix();}
async function build3D(){
 const {T,BGU}=three;const D_=V.disposables;const keep=o=>{D_.push(o);return o;};
 const k=parseFloat(order.size)*25.4/(2*HALF);const g=geo(S.shape);
 const W=(x,y)=>new T.Vector2(x*k,-(y-CY)*k);
 const hang=new T.Group(),pivot=new T.Group();
 // acrylic slab (decimated outline, light bevel)
 const pts=g.outer.filter((_,i)=>i%2===0);
 const shape=new T.Shape(pts.map(([x,y])=>W(x,y)));const tc=W(g.tab.x,g.tab.y);const hr=HOLE_R*k;
 const hole=new T.Path();hole.absarc(tc.x,tc.y,hr,0,Math.PI*2,true);shape.holes.push(hole);
 const D=3.6,bt=.6;
 let geom=new T.ExtrudeGeometry(shape,{depth:D-2*bt,bevelEnabled:true,bevelThickness:bt,bevelSize:.6,bevelOffset:-.6,bevelSegments:IS_MOBILE?2:3,curveSegments:10});
 geom.translate(0,0,-(D-2*bt)/2);
 try{const g2=BGU.toCreasedNormals(geom,Math.PI/6);geom.dispose();geom=g2;}catch(_){geom.computeVertexNormals();}
 keep(geom);
 const acrylic=keep(acrylicMaterial(T,S.holo));
 const slab=new T.Mesh(geom,acrylic);slab.renderOrder=2;hang.add(slab);
 // printed design sealed inside (opaque cut-out, drawn before the clear slab)
 const cv=await renderPrintCanvas();
 const tex=keep(new T.CanvasTexture(cv));tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=Math.min(4,V.renderer.capabilities.getMaxAnisotropy());tex.generateMipmaps=true;
 const pm=keep(new T.MeshBasicMaterial({map:tex,alphaTest:.5,side:T.DoubleSide,toneMapped:false}));
 const pg=keep(new T.PlaneGeometry(330*k,330*k));const plane=new T.Mesh(pg,pm);plane.position.set(0,5*k,0);plane.renderOrder=1;hang.add(plane);
 // chrome hardware: shared geometry + one material
 const chrome=keep(new T.MeshStandardMaterial({color:0xeef1f8,metalness:1,roughness:.12,envMapIntensity:1.5}));
 const add=(geo,mat=chrome)=>{const m=new T.Mesh(geo,mat);hang.add(m);return m;};
 const ringR=3.3;const ring=add(keep(new T.TorusGeometry(ringR,.58,10,32)));ring.rotation.y=Math.PI/2;const ringCY=tc.y+ringR-hr*.45;ring.position.y=ringCY;
 const linkGeo=keep(new T.TorusGeometry(1.5,.42,8,20));let c=ringCY+ringR-.84+2.25;const NL=6;
 for(let i=0;i<NL;i++){const m=add(linkGeo);m.scale.set(1,1.5,1);m.rotation.y=i%2?Math.PI/2:0;m.position.y=c;if(i<NL-1)c+=3.6;}
 const top=c+2.25;let P;
 if(order.att==='keyring'){const R=10;const kc=top-.9+R;const kg=keep(new T.TorusGeometry(R,.8,10,72));for(const dz of [-.5,.5])add(kg).position.set(0,kc,dz);P=kc+R+.8;}
 else if(order.att==='clip'){
  const sc=top-.84+1.7;add(keep(new T.TorusGeometry(1.7,.45,8,20))).position.y=sc;
  add(keep(new T.CylinderGeometry(.85,.85,3.2,14))).position.y=sc+1.7+1.5;
  const bodyR=3.4,sy=1.5;const bc=sc+1.7+3+bodyR*sy+.4;
  const grp=new T.Group();grp.scale.set(1,sy,1);grp.position.y=bc;hang.add(grp);
  const body=new T.Mesh(keep(new T.TorusGeometry(bodyR,1.2,10,40,Math.PI*2*.84)),chrome);body.rotation.z=Math.PI/3;grp.add(body);
  const a1=Math.PI/3+Math.PI*2*.84,a2=Math.PI/3;const p1=new T.Vector3(bodyR*Math.cos(a1),bc+bodyR*sy*Math.sin(a1),0),p2=new T.Vector3(bodyR*Math.cos(a2),bc+bodyR*sy*Math.sin(a2),0);
  const gate=add(keep(new T.CylinderGeometry(.55,.55,p1.distanceTo(p2),10)));gate.position.copy(p1).add(p2).multiplyScalar(.5);gate.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),p2.clone().sub(p1).normalize());
  add(keep(new T.BoxGeometry(1.2,2.4,1.6))).position.set(bodyR+1.2,bc-1,0);
  const tr=add(keep(new T.TorusGeometry(1.6,.5,8,20)));tr.rotation.y=Math.PI/2;const tcy=bc+bodyR*sy+2.3;tr.position.y=tcy;P=tcy+2.1;
 } else {
  const B=top-1.6;const cp=[[0,B],[-1.9,B+1.6],[-.7,B+5],[-3.2,B+12],[-5.2,B+24],[-3.8,B+32.5],[0,B+35],[3.8,B+32.5],[5.2,B+24],[3.2,B+12],[.7,B+5],[1.9,B+1.6]].map(([x,y])=>new T.Vector3(x,y,0));
  const curve=new T.CatmullRomCurve3(cp,true,'catmullrom',.5);
  add(keep(new T.TubeGeometry(curve,96,.85,8,true)),keep(new T.MeshStandardMaterial({color:0xff3ea5,roughness:.5})));
  add(keep(new T.CylinderGeometry(1.5,1.5,3,14))).position.set(0,B+5,0);
  const bg=keep(new T.SphereGeometry(1.8,16,12));
  [[.31,'#b8ff3c'],[.4,'#ffe14a'],[.6,'#8fd8ff'],[.69,'#c9b2ff']].forEach(([u,col])=>{add(bg,keep(new T.MeshStandardMaterial({color:col,roughness:.18}))).position.copy(curve.getPointAt(u));});
  P=B+35.85;
 }
 const bottom=Math.min(...g.outer.map(([,y])=>-(y-CY)*k));
 hang.position.y=-P;pivot.position.y=P;pivot.add(hang);
 const mid=(P+bottom)/2;V.root.position.y=-mid;V.root.add(pivot);
 V.pivot=pivot;V.hang=hang;V.fitH=P-bottom;V.fitW=2*HALF*k;
 $('#mtag').innerHTML=`<b>${order.size}"</b> clear acrylic · ${SHAPES.find(s=>s.id===S.shape).name}${S.holo?' · holo':''}<br>with ${ATT[order.att].name}`;
}
function resetView(){if(!V)return;const a=V.camera.aspect||1;const tf=Math.tan(V.camera.fov*Math.PI/360);const d=Math.max((V.fitH/2)/tf*1.25,(V.fitW/2)/(tf*a)*1.5);const ty=-V.fitH*.04;V.camera.position.set(d*.28,ty+d*.1,d*.95);V.controls.target.set(0,ty,0);V.controls.minDistance=d*.35;V.controls.maxDistance=d*2.4;V.controls.update();kick();}
// render loop runs only while something moves
function tick(now){
 if(!V)return;V.raf=0;if(!modalOpen||document.hidden)return;
 const dt=Math.min(.05,(now-(V.last||now))/1000);V.last=now;
 if(motion&&V.pivot){V.tSway+=dt;const t=V.tSway;V.pivot.rotation.z=Math.sin(t*1.15)*.065;V.pivot.rotation.x=Math.sin(t*.85+.6)*.05;V.hang.rotation.y=Math.sin(t*.55)*.22;}
 V.inTick=true;V.changed=false;V.controls.update();V.inTick=false;
 V.renderer.render(V.scene,V.camera);
 if(!window.__3dReady)window.__3dReady=true;window.__frames=(window.__frames||0)+1;
 // keep going only while something moves: motion, a finger on it, or damping still settling
 if(!V.raf&&(motion||V.interacting||V.changed))V.raf=requestAnimationFrame(tick);
}
function kick(){if(V&&!V.raf&&!V.inTick&&modalOpen&&!document.hidden){V.last=0;V.raf=requestAnimationFrame(tick);}}
document.addEventListener('visibilitychange',()=>{if(!V)return;if(document.hidden){cancelAnimationFrame(V.raf);V.raf=0;}else kick();});
function disposeViewer(){
 if(!V)return;cancelAnimationFrame(V.raf);V.ro.disconnect();V.controls.dispose();
 V.disposables.forEach(o=>o.dispose&&o.dispose());V.envRT.dispose();
 V.renderer.dispose();V.renderer.forceContextLoss();V.canvas.remove();V=null;
}
async function open3D(){
 sel=null;selChanged();clearTimeout(idleT);motion=!REDUCED;
 $('#modal').classList.add('open');modalOpen=true;$('#mload').style.display='grid';$('#mload').textContent='polishing the acrylic…';$('#mtag').innerHTML='';window.__3dReady=false;
 try{
  await loadThree();if(!modalOpen)return;
  disposeViewer();V=createViewer();resize3D();await build3D();if(!modalOpen){disposeViewer();return;}
  resize3D();resetView();$('#mload').style.display='none';kick();
 }catch(err){console.error(err);$('#mload').innerHTML='hmm, 3D needs WebGL and an internet connection<br><small style="font-family:Fredoka;font-size:17px">(three.js loads from a CDN)</small>';}
}
function close3D(){modalOpen=false;clearTimeout(idleT);$('#modal').classList.remove('open');disposeViewer();}
$('#open3d').onclick=open3D;$('#close3d').onclick=close3D;
$('#add3d').onclick=()=>addToBag($('#add3d'));
const setMotion=m=>{motion=m;clearTimeout(idleT);if(V){V.controls.autoRotate=m;kick();}};
window.__charm={get S(){return S},order,renderAll,open3D,close3D,commit,undo,redo,addSticker,setTab,setSel:id=>{sel=id;selChanged();},setMotion,collapse,get V(){return V}};
renderAll();
document.fonts&&document.fonts.ready.then(()=>{renderEls();updateSel();});
